services:
  kifli:
    build: .
    image: kifli-asszisztens
    container_name: kifli
    restart: unless-stopped

    ports:
      - "8420:8420"     # a felület
      - "8421:8421"     # a hangkapcsolat

    # A konténer a SAJÁT felhasználódként fusson, különben nem tud írni
    # az adat/ mappába. Az azonosítódat így kapod meg:  id -u  és  id -g
    # Synologyn tipikusan 1026:100. A .env-ből is jöhet: KIFLI_UID / GID
    user: "${KIFLI_UID:-1026}:${KIFLI_GID:-100}"

    volumes:
      # A beállítások és a megtanult termékek a NAS-on maradnak,
      # így a konténer bármikor újraépíthető.
      - ./adat:/app/adat
      - ./.env:/app/.env:ro

    environment:
      - TZ=Europe/Budapest
      - PYTHONUNBUFFERED=1
      # HTTPS mögött: melyik porton éri el kívülről a böngésző a
      # hangkapcsolatot. A .env-ből is jöhet.
      - WS_KULSO_PORT=${WS_KULSO_PORT:-}
      - WS_UTVONAL=${WS_UTVONAL:-}

    # A DS216+II-n a memória szűkös lehet, ha sok minden fut mellette
    mem_limit: 512m

    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "3"
