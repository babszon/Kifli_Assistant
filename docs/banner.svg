<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" width="1200" height="340" role="img" aria-label="Kifli asszisztens">
  <defs>
    <linearGradient id="mezo" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#16305C"/>
      <stop offset="0.55" stop-color="#132B52"/>
      <stop offset="1" stop-color="#0F2342"/>
    </linearGradient>
    <linearGradient id="arany" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#EFC169"/>
      <stop offset="1" stop-color="#C98F2E"/>
    </linearGradient>
    <radialGradient id="derenges" cx="0.22" cy="0.5" r="0.55">
      <stop offset="0" stop-color="#2A5290" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#2A5290" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="340" fill="url(#mezo)"/>
  <rect width="1200" height="340" fill="url(#derenges)"/>

  <!-- zománc peremvonal -->
  <rect x="16" y="16" width="1168" height="308" fill="none"
        stroke="#F6F3E9" stroke-opacity="0.16" stroke-width="1.5" rx="6"/>

  <!-- kifli jel -->
  <g transform="translate(84 112)">
    <path d="M8 60 C2 26 26 2 64 6 C58 16 46 20 34 28 C22 36 16 48 8 60 Z" fill="url(#arany)"/>
  </g>

  <!-- cím -->
  <text x="230" y="158" font-family="Georgia, 'Times New Roman', serif"
        font-size="62" fill="#F6F3E9" letter-spacing="0.5">Kifli asszisztens</text>

  <text x="232" y="200" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif"
        font-size="20" fill="#7E96BC">Elmondod, mire van szükséged. A többit elintézi.</text>

  <!-- hanghullám -->
  <g transform="translate(232 244)" stroke="#C8322B" stroke-width="3.5"
     stroke-linecap="round">
    <line x1="0"   y1="-4"  x2="0"   y2="4"/>
    <line x1="13"  y1="-11" x2="13"  y2="11"/>
    <line x1="26"  y1="-20" x2="26"  y2="20"/>
    <line x1="39"  y1="-13" x2="39"  y2="13"/>
    <line x1="52"  y1="-24" x2="52"  y2="24"/>
    <line x1="65"  y1="-9"  x2="65"  y2="9"/>
    <line x1="78"  y1="-17" x2="78"  y2="17"/>
    <line x1="91"  y1="-6"  x2="91"  y2="6"/>
  </g>
  <g transform="translate(340 244)" stroke="#7FB069" stroke-width="3.5"
     stroke-linecap="round" stroke-opacity="0.75">
    <line x1="0"  y1="-14" x2="0"  y2="14"/>
    <line x1="13" y1="-22" x2="13" y2="22"/>
    <line x1="26" y1="-8"  x2="26" y2="8"/>
    <line x1="39" y1="-18" x2="39" y2="18"/>
    <line x1="52" y1="-5"  x2="52" y2="5"/>
    <line x1="65" y1="-11" x2="65" y2="11"/>
  </g>

  <!-- jobb oldali kosárcédula -->
  <g transform="translate(830 74)">
    <rect width="290" height="196" rx="10" fill="#1B3A6B"
          stroke="#F6F3E9" stroke-opacity="0.14"/>
    <text x="20" y="34" font-family="Georgia, serif" font-size="17"
          fill="#F6F3E9">Kosár</text>
    <text x="270" y="34" text-anchor="end"
          font-family="-apple-system, 'Segoe UI', sans-serif" font-size="12"
          fill="#7E96BC">9 tétel</text>
    <line x1="0" y1="50" x2="290" y2="50" stroke="#F6F3E9"
          stroke-opacity="0.12"/>

    <g font-family="-apple-system, 'Segoe UI', sans-serif" font-size="13"
       fill="#F6F3E9">
      <text x="20" y="76">Coca-Cola multipack</text>
      <text x="270" y="76" text-anchor="end">999 Ft</text>
      <text x="20" y="104">Pringles ×3</text>
      <text x="270" y="104" text-anchor="end">5 397 Ft</text>
      <text x="20" y="132">Farm tojás ×2</text>
      <text x="270" y="132" text-anchor="end">1 678 Ft</text>
    </g>

    <line x1="0" y1="150" x2="290" y2="150" stroke="#F6F3E9"
          stroke-opacity="0.12"/>
    <text x="20" y="177" font-family="-apple-system, 'Segoe UI', sans-serif"
          font-size="12" fill="#7E96BC">Összesen</text>
    <text x="270" y="179" text-anchor="end" font-family="Georgia, serif"
          font-size="21" fill="#F6F3E9">24 382 Ft</text>
  </g>
</svg>
