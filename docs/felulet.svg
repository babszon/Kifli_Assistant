<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="A Kifli asszisztens felülete: balra a beszélgetés, jobbra az épülő kosár">
  <defs>
    <linearGradient id="hatter" x1="0" y1="0" x2="0.6" y2="1">
      <stop offset="0" stop-color="#16305C"/>
      <stop offset="1" stop-color="#112647"/>
    </linearGradient>
    <clipPath id="keret"><rect width="960" height="560" rx="12"/></clipPath>
  </defs>

  <g clip-path="url(#keret)">
    <rect width="960" height="560" fill="url(#hatter)"/>
    <rect x="700" width="260" height="560" fill="#000" fill-opacity="0.17"/>
    <line x1="700" y1="0" x2="700" y2="560" stroke="#F6F3E9" stroke-opacity="0.13"/>

    <!-- fejléc -->
    <line x1="0" y1="56" x2="700" y2="56" stroke="#F6F3E9" stroke-opacity="0.13"/>
    <g transform="translate(20 14) scale(0.4)">
      <path d="M8 60 C2 26 26 2 64 6 C58 16 46 20 34 28 C22 36 16 48 8 60 Z" fill="#D9A441"/>
    </g>
    <text x="56" y="36" font-family="Georgia, serif" font-size="15"
          fill="#F6F3E9">Kifli asszisztens</text>
    <circle cx="612" cy="31" r="4" fill="#7FB069"/>
    <text x="624" y="36" font-family="-apple-system,'Segoe UI',sans-serif"
          font-size="12" fill="#7E96BC">kész</text>

    <!-- felhasználói buborék -->
    <g transform="translate(0 92)">
      <text x="660" y="0" text-anchor="end"
            font-family="-apple-system,'Segoe UI',sans-serif" font-size="11"
            fill="#7E96BC">te</text>
      
      <rect x="248" y="10" width="412" height="44" rx="13" fill="#1B3A6B"/>
      <text x="270" y="38" font-family="-apple-system,'Segoe UI',sans-serif"
            font-size="14" fill="#F6F3E9">Elfogyott a ketchup, kellene 20 tojás meg 4 liter kóla.</text>
    </g>

    <!-- asszisztens válasza -->
    <g transform="translate(40 180)">
      <text x="0" y="0" font-family="-apple-system,'Segoe UI',sans-serif"
            font-size="11" fill="#7E96BC">asszisztens</text>
      <text font-family="Georgia, serif" font-size="17" fill="#F6F3E9">
        <tspan x="0" y="26">Bement a Heinz ketchup, 570 gramm, 2249</tspan>
        <tspan x="0" y="50">forintért. A tojásból két doboz Farm Prémium,</tspan>
        <tspan x="0" y="74">a kóla pedig most akciós — 999 forint.</tspan>
      </text>
    </g>

    <!-- találati kártya -->
    <g transform="translate(40 288)">
      <rect width="560" height="110" rx="9" fill="#1B3A6B" fill-opacity="0.45"
            stroke="#F6F3E9" stroke-opacity="0.13"/>
      <text x="16" y="24" font-family="-apple-system,'Segoe UI',sans-serif"
            font-size="11.5" fill="#7E96BC">▾  ketchup · 25 találat</text>
      <line x1="0" y1="36" x2="560" y2="36" stroke="#F6F3E9" stroke-opacity="0.1"/>
      <g font-family="-apple-system,'Segoe UI',sans-serif" font-size="12.5"
         fill="#F6F3E9">
        <text x="16" y="58">Kitchin Mild Ketchup</text>
        <text x="330" y="58" fill="#7E96BC" font-size="11">674 Ft/kg</text>
        <text x="478" y="58" text-anchor="end">674 Ft</text>
        <rect x="492" y="47" width="46" height="16" rx="8" fill="#7FB069" fill-opacity="0.22"/>
        <text x="515" y="58.5" text-anchor="middle" font-size="10" fill="#7FB069">olcsó</text>

        <line x1="0" y1="70" x2="560" y2="70" stroke="#F6F3E9" stroke-opacity="0.1"/>
        <text x="16" y="92">Heinz ketchup</text>
        <text x="330" y="92" fill="#7E96BC" font-size="11">3 213 Ft/kg</text>
        <text x="478" y="92" text-anchor="end">2 249 Ft</text>
      </g>
    </g>

    <!-- mikrofon -->
    <line x1="0" y1="446" x2="700" y2="446" stroke="#F6F3E9" stroke-opacity="0.13"/>
    <circle cx="68" cy="500" r="27" fill="#C8322B"/>
    <circle cx="68" cy="500" r="38" fill="#C8322B" fill-opacity="0.14"/>
    <g stroke="#F6F3E9" stroke-width="1.8" fill="none">
      <rect x="62" y="489" width="12" height="16" rx="6"/>
      <path d="M56 500a12 12 0 0 0 24 0M68 512v5" stroke-linecap="round"/>
    </g>
    <rect x="112" y="476" width="556" height="48" rx="24" fill="#1B3A6B"/>
    <text x="136" y="506" font-family="-apple-system,'Segoe UI',sans-serif"
          font-size="14" fill="#7E96BC">vagy írd be, mire van szükséged</text>

    <!-- kosár -->
    <text x="724" y="34" font-family="Georgia, serif" font-size="15"
          fill="#F6F3E9">Kosár</text>
    <text x="936" y="34" text-anchor="end"
          font-family="-apple-system,'Segoe UI',sans-serif" font-size="11"
          fill="#7E96BC">9 tétel</text>
    <line x1="700" y1="56" x2="960" y2="56" stroke="#F6F3E9" stroke-opacity="0.13"/>

    <g font-family="-apple-system,'Segoe UI',sans-serif" font-size="12.5"
       fill="#F6F3E9">
      <text x="724" y="88" fill="#7E96BC">1×</text>
      <text x="748" y="88">Coca-Cola multipack</text>
      <text x="936" y="88" text-anchor="end">999 Ft</text>

      <text x="724" y="124" fill="#7E96BC">3×</text>
      <text x="748" y="124">Pringles</text>
      <text x="936" y="124" text-anchor="end">5 397 Ft</text>

      <text x="724" y="160" fill="#7E96BC">2×</text>
      <text x="748" y="160">Farm Prémium tojás</text>
      <text x="936" y="160" text-anchor="end">1 678 Ft</text>

      <text x="724" y="196" fill="#7E96BC">1×</text>
      <text x="748" y="196">Finish tabletta</text>
      <text x="936" y="196" text-anchor="end">7 039 Ft</text>

      <text x="724" y="232" fill="#7E96BC">1×</text>
      <text x="748" y="232">Persil mosókapszula</text>
      <text x="936" y="232" text-anchor="end">6 799 Ft</text>

      <text x="724" y="268" fill="#7E96BC">1×</text>
      <text x="748" y="268">Silan öblítő</text>
      <text x="936" y="268" text-anchor="end">1 639 Ft</text>

      <text x="724" y="304" fill="#7E96BC">1×</text>
      <text x="748" y="304">Hazai lapos káposzta</text>
      <text x="936" y="304" text-anchor="end">731 Ft</text>
    </g>

    <line x1="700" y1="420" x2="960" y2="420" stroke="#F6F3E9" stroke-opacity="0.13"/>
    <text x="724" y="450" font-family="-apple-system,'Segoe UI',sans-serif"
          font-size="12.5" fill="#F6F3E9">Összesen</text>
    <text x="936" y="454" text-anchor="end" font-family="Georgia, serif"
          font-size="21" fill="#F6F3E9">24 382 Ft</text>

    <rect x="724" y="478" width="212" height="40" rx="8" fill="#F6F3E9"/>
    <text x="830" y="503" text-anchor="middle"
          font-family="-apple-system,'Segoe UI',sans-serif" font-size="13"
          font-weight="500" fill="#132B52">Befejezem a Kifli appban</text>
  </g>

  <rect x="0.5" y="0.5" width="959" height="559" rx="12" fill="none"
        stroke="#F6F3E9" stroke-opacity="0.12"/>
</svg>
